services:
  warp-n1:
    build: .
    image: sinproxy/warp-socks:1.0
    container_name: warp-n1
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    labels:
      - "autoheal=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add: [NET_ADMIN, MKNOD, AUDIT_WRITE]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    ports:
      - "127.0.0.1:40001:1080"
      - "127.0.0.1:41001:8080"
    environment:
      - WARP_SLEEP=${WARP_SLEEP:-5}
      - V6PIN_HOSTS=${V6PIN_HOSTS:-opencode.ai}
      - V6ONLY=${V6ONLY:-1}
    volumes:
      - ./data-n1:/var/lib/cloudflare-warp

